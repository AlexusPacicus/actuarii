name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pydantic==2.13.3 pytest==9.1.1
      - name: Clean-room sequence (docs/design/PRUEBA_EN_LIMPIO.md, section 4)
        run: pytest tests/unit/test_installer.py::test_a_fresh_install_copies_every_kit_file_with_its_bytes_executable_bit_and_links tests/unit/test_installer.py::test_before_the_validator_has_ever_run_the_installed_gate_still_denies tests/unit/test_installer.py::test_the_installed_kit_denies_an_unreceipted_write_and_allows_it_after_the_targets_own_receipt
      - name: Full suite
        run: pytest tests
