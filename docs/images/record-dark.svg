<svg xmlns="http://www.w3.org/2000/svg" width="860" height="225" viewBox="0 0 860 225" role="img" aria-labelledby="title desc">
  <title id="title">How the commit record of one file is made</title>
  <desc id="desc">Top: two writes recorded by the gate lead from the content at HEAD (a) to the committed content (c), so the commit hook writes matches, with the reason of each write. Bottom: the file was changed by hand after the first write, so the recorded writes do not reach the committed content (d), and the hook writes changed outside the channel.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .t { font-size: 14px; font-weight: 600; fill: #e6edf3; }
    .s { font-size: 12px; fill: #9198a1; }
    .z { font-size: 12px; font-weight: 600; fill: #9198a1; }
    .d { font-size: 12px; fill: #f85149; }
    .c { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #e6edf3; }
    .box { fill: #151b23; stroke: #656c76; stroke-width: 1; }
    .a { fill: none; stroke: #9198a1; stroke-width: 1.25; }
    .no { stroke: #f85149; stroke-dasharray: 4 3; }
    .head { fill: #9198a1; }
    .headno { fill: #f85149; }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0 0L10 5L0 10z"/></marker>
    <marker id="mno" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="headno" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <text class="z" x="20" y="22">Every change went through the gate</text>

  <rect class="box" x="20" y="40" width="110" height="46" rx="6"/>
  <text class="t" x="75" y="59" text-anchor="middle">At HEAD</text>
  <text class="s" x="75" y="77" text-anchor="middle">sha256 a</text>

  <rect class="box" x="230" y="40" width="110" height="46" rx="6"/>
  <text class="t" x="285" y="59" text-anchor="middle">After write 1</text>
  <text class="s" x="285" y="77" text-anchor="middle">sha256 b</text>

  <rect class="box" x="440" y="40" width="110" height="46" rx="6"/>
  <text class="t" x="495" y="59" text-anchor="middle">Committed</text>
  <text class="s" x="495" y="77" text-anchor="middle">sha256 c</text>

  <text class="s" x="180" y="55" text-anchor="middle">write 1: a → b</text>
  <line class="a" x1="130" y1="63" x2="229" y2="63" marker-end="url(#m)"/>
  <text class="s" x="180" y="79" text-anchor="middle">reason A</text>

  <text class="s" x="390" y="55" text-anchor="middle">write 2: b → c</text>
  <line class="a" x1="340" y1="63" x2="439" y2="63" marker-end="url(#m)"/>
  <text class="s" x="390" y="79" text-anchor="middle">reason B</text>

  <text class="s" x="595" y="55" text-anchor="middle">reached</text>
  <line class="a" x1="550" y1="63" x2="639" y2="63" marker-end="url(#m)"/>

  <rect class="box" x="640" y="30" width="208" height="66" rx="6"/>
  <text class="c" x="652" y="52">Actuarii-Record: matches</text>
  <text class="c" x="652" y="68">Actuarii-Rationale: reason A</text>
  <text class="c" x="652" y="84">Actuarii-Rationale: reason B</text>

  <text class="z" x="20" y="134">The file changed outside the gate after write 1</text>

  <rect class="box" x="20" y="152" width="110" height="46" rx="6"/>
  <text class="t" x="75" y="171" text-anchor="middle">At HEAD</text>
  <text class="s" x="75" y="189" text-anchor="middle">sha256 a</text>

  <rect class="box" x="230" y="152" width="110" height="46" rx="6"/>
  <text class="t" x="285" y="171" text-anchor="middle">After write 1</text>
  <text class="s" x="285" y="189" text-anchor="middle">sha256 b</text>

  <rect class="box" x="440" y="152" width="110" height="46" rx="6"/>
  <text class="t" x="495" y="171" text-anchor="middle">Committed</text>
  <text class="s" x="495" y="189" text-anchor="middle">sha256 d</text>

  <text class="s" x="180" y="167" text-anchor="middle">write 1: a → b</text>
  <line class="a" x1="130" y1="175" x2="229" y2="175" marker-end="url(#m)"/>
  <text class="s" x="180" y="191" text-anchor="middle">reason A</text>

  <text class="d" x="390" y="167" text-anchor="middle">by hand: b → d</text>
  <line class="a no" x1="340" y1="175" x2="439" y2="175" marker-end="url(#mno)"/>
  <text class="d" x="390" y="191" text-anchor="middle">no record</text>

  <text class="d" x="595" y="167" text-anchor="middle">not reached</text>
  <line class="a no" x1="550" y1="175" x2="639" y2="175" marker-end="url(#mno)"/>

  <rect class="box" x="640" y="142" width="208" height="66" rx="6"/>
  <text class="c" x="652" y="171">Actuarii-Record:</text>
  <text class="c" x="652" y="187">changed outside the channel</text>
</svg>
