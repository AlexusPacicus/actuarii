[project]
name = "actuarii"
version = "0.1.0"
description = "Work records for coding agents: every action leaves a record that it happened, and why."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alexis Zapico Fernández" }]
requires-python = "~=3.11"
dependencies = ["pydantic==2.13.3"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
